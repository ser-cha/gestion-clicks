<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Contador de Clicks</title>
</head>

<style>
/* ===== Estilos generales (Dev D) ===== */
body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* Titulo */
h1 {
    color: white;
    text-align: center;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    margin-bottom: 30px;
}

/* Parrafos (clicks y, mas adelante, la hora) */
p {
    background-color: white;
    color: #333;
    font-size: 22px;
    padding: 15px 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    text-align: center;
    min-width: 250px;
}

/* Numero del contador */
#contador {
    font-weight: bold;
    font-size: 30px;
    color: #764ba2;
}

/* Todos los botones (contar y, mas adelante, reiniciar) */
button {
    color: white;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    padding: 12px 30px;
    margin: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    transition: transform 0.1s, background-color 0.3s;
    background-color: #888;
}

/* Boton de contar */
#btn {
    background-color: #ff7a59;
}

#btn:hover {
    background-color: #ff5a30;
}

/* Efecto al pulsar cualquier boton */
button:active {
    transform: scale(0.95);
}
</style>

<body>

<h1>Contador cliks. Grupo (Sergio, Mauricio, Mario, Daniel)</h1>

<button id="btn">Haz clic</button>

<button id="reset">Reiniciar</button>

<p>Clicks: <span id="contador">0</span></p>

<script>
    let contador = 0;
    const contadorDisplay = document.getElementById("contador");
    const botonContar = document.getElementById("btn");

    botonContar.addEventListener("click", () => {
        contador++;
        contadorDisplay.innerText = contador;

        // Dev C (Hora) añadirá su código aquí dentro
    });

    // Dev B (Reiniciar) añadirá su script aquí
const botonReset = document.getElementById("reset");

botonReset.addEventListener("click", () => {
    contador = 0;
    contadorDisplay.innerText = contador;
});
</script>

</body>

</html>
